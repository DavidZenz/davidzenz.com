name: Refresh publications

on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC (before the 04:17 daily deploy)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:publications
      - name: Commit refreshed publications
        run: |
          if ! git diff --quiet -- src/_data/publications.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/_data/publications.json
            git commit -m "chore: refresh publications from wiiw"
            git push
          else
            echo "No change in publications."
          fi
