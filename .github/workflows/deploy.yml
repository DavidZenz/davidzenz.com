name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BANDSINTOWN_KEY_BREWTALITY: ${{ secrets.BANDSINTOWN_KEY_BREWTALITY }}
          BANDSINTOWN_KEY_METTERNICH: ${{ secrets.BANDSINTOWN_KEY_METTERNICH }}
          RUNALYZE_TOKEN: ${{ secrets.RUNALYZE_TOKEN }}
      - name: Persist race data cache
        run: |
          if ! git diff --quiet -- src/_data/races.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/_data/races.json
            git commit -m "chore: update cached race data"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
